name: Auth tests

# End-to-end tests for agent sign-in, invitations, password reset and sessions.
# Runs the real site against a local stand-in for Supabase Auth and an
# in-memory Postgres: no secrets and no real accounts are used.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: auth-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Auth test suite
        run: npm run test:auth
